name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Build with the toolchain pinned in go.mod (its patch releases carry security fixes).
  GOTOOLCHAIN: auto

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Use the Go toolchain from go.mod
        run: |
          want=$(go mod edit -json | jq -r '.Toolchain // empty')
          echo "go.mod toolchain: ${want:-none}, using $(go env GOVERSION)"
          [ -z "$want" ] || [ "$(go env GOVERSION)" = "$want" ]
      - name: Install GTK 3 headers
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev
      - name: Vet (Linux + Windows)
        run: make vet
      - name: Test
        run: make test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Use the Go toolchain from go.mod
        run: |
          want=$(go mod edit -json | jq -r '.Toolchain // empty')
          echo "go.mod toolchain: ${want:-none}, using $(go env GOVERSION)"
          [ -z "$want" ] || [ "$(go env GOVERSION)" = "$want" ]
      - name: Install GTK 3 headers
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev
      - name: Build Windows and Linux binaries
        run: make build
      - name: Check glibc requirement of the Linux binary
        run: make glibc-check
      - uses: actions/upload-artifact@v4
        with:
          name: agendling-binaries
          path: bin/
