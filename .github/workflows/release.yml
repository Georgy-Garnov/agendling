name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install GTK 3 headers
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev
      - name: Test
        run: make test
      - name: Build
        run: make build VERSION=${GITHUB_REF_NAME}
      - name: Package
        run: |
          mkdir -p dist
          cp LICENSE THIRD_PARTY_NOTICES.md README.md bin/
          (cd bin && zip -q ../dist/agendling-${GITHUB_REF_NAME}-windows-amd64.zip agendling.exe LICENSE THIRD_PARTY_NOTICES.md README.md)
          (cd bin && tar czf ../dist/agendling-${GITHUB_REF_NAME}-linux-amd64.tar.gz agendling-linux-amd64 LICENSE THIRD_PARTY_NOTICES.md README.md)
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
