name: govulncheck

# Known vulnerabilities the code can reach, in dependencies and in the standard library of the
# Go toolchain pinned in go.mod. Also runs weekly: new advisories appear without any commit.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulncheck:
    runs-on: ubuntu-latest
    env:
      # Build with the toolchain go.mod asks for, so the standard library that is scanned is
      # the one the release binaries contain.
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install GTK 3 headers
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev
      - name: Use the Go toolchain from go.mod
        run: |
          want=$(go mod edit -json | jq -r '.Toolchain // empty')
          echo "go.mod toolchain: ${want:-none}, using $(go env GOVERSION)"
          [ -z "$want" ] || [ "$(go env GOVERSION)" = "$want" ]
      - name: govulncheck (Windows and Linux)
        run: make vulncheck
